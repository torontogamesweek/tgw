name: schedule

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schedule
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-schedule.mjs
      - run: |
          if git diff --quiet -- schedule-data.json; then
            echo "schedule-data.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule-data.json
          git commit -m "update schedule-data.json"
          git push
